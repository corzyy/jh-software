[package]
name = "jh-software"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2"
bincode = "1"
flate2 = "1.1.10"
gtk = { version = "0.10", package = "gtk4", features = ["v4_18", "gio_v2_80"] }
libflatpak = "0.7"
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
